spring:
  application:
    name: springPaymentService

server:
  port: 9091

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/